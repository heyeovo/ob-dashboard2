<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>气泡候选 · 窗前的薄玻璃</title>
<meta name="description" content="聊天气泡的几种深浅，4 个主题 × 渐变/照片背景，左右滑着比，点心收藏。第一张是现在的样子。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#EDEAE6;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  body[data-theme="dusk"]{background:#16151a}
  .serif{font-family:"Cormorant Garamond","Noto Serif SC",serif}

  /* ── 主题（与 globals.css 同值） ── */
  [data-theme="apricot"]{--base:#F5EBE3;--accent:#C27B63;--ink:#3F3634;--tint:255 249 245;--hi:255 255 255;
    --mesh:radial-gradient(80% 55% at 5% 18%,#EFC0A0,transparent 72%),radial-gradient(75% 55% at 100% 62%,#DCCBE0,transparent 72%),radial-gradient(70% 45% at 45% 100%,#F3D2BE,transparent 72%),linear-gradient(160deg,#F8EEE5,#EEE3E4)}
  [data-theme="sakura"]{--base:#F6E8EA;--accent:#C0707F;--ink:#3F3236;--tint:255 247 248;--hi:255 255 255;
    --mesh:radial-gradient(80% 55% at 92% 20%,#ECB6C4,transparent 72%),radial-gradient(75% 55% at 0% 55%,#F5CDBD,transparent 72%),radial-gradient(80% 50% at 65% 95%,#E5C1D3,transparent 72%),linear-gradient(180deg,#FAF0EF,#F1DEE3)}
  [data-theme="mist"]{--base:#E8EDF1;--accent:#5F7F98;--ink:#2F3940;--tint:250 252 253;--hi:255 255 255;
    --mesh:radial-gradient(80% 55% at 8% 20%,#BFD1E1,transparent 72%),radial-gradient(75% 55% at 100% 55%,#F3ECE2,transparent 72%),radial-gradient(80% 50% at 30% 98%,#C9DADE,transparent 72%),linear-gradient(180deg,#EEF2F4,#E0E7EC)}
  [data-theme="dusk"]{--base:#1E1C23;--accent:#D9A08A;--ink:#EDE6E1;--tint:40 36 46;--hi:255 255 255;
    --mesh:radial-gradient(80% 55% at 95% 20%,#433756,transparent 72%),radial-gradient(75% 55% at 0% 60%,#2A3546,transparent 72%),radial-gradient(65% 45% at 80% 95%,#553F38,transparent 72%),linear-gradient(180deg,#221F28,#1A1A20)}
  /* 照片模式：中性 tint（同正式版），背景用一张很“花”的合成图模拟真实照片 */
  [data-bg="photo"]{--tint:255 255 255}
  [data-bg="photo"][data-theme="dusk"]{--tint:24 22 28}
  .photo{background:
    radial-gradient(18% 14% at 20% 22%,#f7e27a,transparent 70%),
    radial-gradient(22% 16% at 78% 30%,#e98fb0,transparent 70%),
    radial-gradient(26% 20% at 35% 58%,#6fae6a,transparent 72%),
    radial-gradient(20% 18% at 85% 70%,#f3b35e,transparent 70%),
    radial-gradient(30% 22% at 10% 85%,#4f8f5c,transparent 72%),
    radial-gradient(24% 16% at 60% 92%,#d86f8f,transparent 70%),
    radial-gradient(40% 30% at 55% 10%,#9cc7e8,transparent 75%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 6px,transparent 6px 22px),
    linear-gradient(180deg,#b9d4c0,#7fa98a 60%,#5d8a6b)}
  [data-theme="dusk"] .photo{filter:brightness(.55) saturate(.9)}
  .photo-veil{position:absolute;inset:0;background:rgb(var(--tint)/.32);pointer-events:none}

  header{padding:18px 20px 4px;color:#4a4540}
  body[data-theme="dusk"] header,body[data-theme="dusk"] .meta,body[data-theme="dusk"] footer{color:#e6dfda}
  header h1{font:600 26px/1.2 "Cormorant Garamond","Noto Serif SC",serif;letter-spacing:.02em}
  header p{font-size:12px;opacity:.65;margin-top:4px}
  .ctrl{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px 0}
  .chip{border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.55);border-radius:999px;padding:6px 12px;font-size:12px;color:#4a4540}
  body[data-theme="dusk"] .chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#e6dfda}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .sep{width:1px;background:rgba(0,0,0,.12);margin:2px 4px}

  .rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 20px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .slot{flex:0 0 min(86vw,360px);scroll-snap-align:center}
  .meta{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 4px 0;color:#4a4540;gap:10px}
  .meta b{font:600 18px "Cormorant Garamond","Noto Serif SC",serif}
  .meta small{display:block;font-size:11px;opacity:.65;margin-top:2px;line-height:1.5}
  .heart{border:0;background:none;font-size:22px;line-height:1;color:#c9a9a0;padding:2px}
  .heart.on{color:var(--accent)}

  /* ── 手机模样 ── */
  .phone{position:relative;height:640px;border-radius:30px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);background-image:var(--mesh);color:color-mix(in srgb,var(--ink) 92%,var(--base))}
  .phone .bgl{position:absolute;inset:0}
  .top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:9px;padding:14px 12px 10px;background:rgb(var(--tint)/.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 -1px 0 rgb(var(--hi)/.35)}
  .back{font-size:20px;opacity:.55;width:14px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 15px "Noto Serif SC",serif}
  .nm{flex:1;min-width:0}
  .nm .l1{display:flex;align-items:center;gap:6px;font:600 16px "Noto Serif SC",serif}
  .cap{font:600 9.5px -apple-system,sans-serif;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .nm .l2{font-size:10.5px;opacity:.55;margin-top:1px}
  .ic{width:28px;height:28px;display:grid;place-items:center;opacity:.6}
  .ic svg{width:19px;height:19px}

  .stream{position:absolute;inset:0;overflow-y:auto;padding:74px 12px 70px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
  .stream::-webkit-scrollbar{display:none}
  .row{display:flex;flex-direction:column;gap:6px}
  .row.u{align-items:flex-end}
  .row.a{align-items:flex-start}
  .b{max-width:82%;padding:9px 13px;font-size:14px;line-height:1.6;border-radius:var(--r)}
  .b.wide{max-width:100%;width:100%}
  .b h4{font-size:14px;font-weight:600;margin-bottom:4px}
  .b ul{padding-left:16px}
  .b li{margin:2px 0}
  .b li::marker{color:color-mix(in srgb,var(--accent) 70%,transparent)}
  .b b{font-weight:600}
  .code{margin-top:6px;border-radius:10px;padding:8px 10px;font:12px/1.5 ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--ink) 7%,transparent);white-space:pre;overflow-x:auto}
  .act{display:flex;align-items:center;gap:12px;padding:2px 4px 6px;opacity:.42;font-size:10.5px}
  .act svg{width:13px;height:13px}
  .act .t{margin-left:2px}
  .row.u .act{flex-direction:row-reverse}
  .tp{display:flex;align-items:center;gap:4px;font-size:11.5px;opacity:.55;padding:2px 4px}
  .tp i{font-style:normal}
  .wake{align-self:center;font-size:10px;opacity:.45;padding:4px 0}

  .composer{position:absolute;left:10px;right:10px;bottom:12px;z-index:2;display:flex;align-items:center;gap:8px;padding:7px 7px 7px 14px;border-radius:999px;background:rgb(var(--tint)/.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 4px 18px color-mix(in srgb,var(--ink) 10%,transparent),inset 0 1px 0 rgb(var(--hi)/.4)}
  .composer span{flex:1;font:italic 500 14px "Cormorant Garamond","Noto Serif SC",serif;opacity:.45}
  .send{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
  .send svg{width:15px;height:15px}

  /* ── 候选：每张卡在 .phone 上设 --uf / --af / --r / --edge / --sh ── */
  .b{background:var(--af);box-shadow:var(--edge),var(--sh)}
  .row.u .b{background:var(--uf);color:var(--ut,inherit)}
  /* 现状：列表整宽无底色、小标题单独成泡 */
  .v-now .b.bare{background:none;box-shadow:none;padding:2px 2px}
  .v-now .row.a .b:not(.bare){border-radius:14px}

  footer{padding:10px 20px 34px;font-size:12px;color:#6d655e;line-height:1.7}
  footer b{font-weight:600}
</style>
</head>
<body data-theme="apricot" data-bg="gradient">
<header>
  <h1>窗前的薄玻璃</h1>
  <p>气泡候选：切主题、切背景，左右滑着比。第一张是现在的样子。</p>
</header>
<div class="ctrl" id="ctrl"></div>
<div class="rail" id="rail"></div>
<footer id="foot">点心收藏，收藏的会列在这里。</footer>

<script>
const THEMES=[['apricot','杏雾'],['sakura','樱粉'],['mist','雾蓝'],['dusk','夜']]
const BGS=[['gradient','渐变'],['photo','照片']]
const T='rgb(var(--tint)/'
const VARIANTS=[
  {id:'now',name:'现状',note:'你的：强调色 12% · 我的：墨色 5% · 跟浓度滑条走（这里按默认 78%）。列表不进气泡，小标题单独成泡。',
   uf:`color-mix(in srgb,var(--accent) 12%,${T}.78))`,af:`color-mix(in srgb,var(--ink) 5%,${T}.78))`,r:'20px',edge:'0 0 #0000',sh:'0 0 #0000',now:true},
  {id:'light',name:'轻',note:'你的：强调色 18% · 我的：强调色 4% · 底不透明度 84%。最通透，照片透得最多。',
   uf:`color-mix(in srgb,var(--accent) 18%,${T}.84))`,af:`color-mix(in srgb,var(--accent) 4%,${T}.84))`,r:'18px',
   edge:'inset 0 1px 0 rgb(var(--hi)/.55)',sh:'0 2px 10px color-mix(in srgb,var(--ink) 5%,transparent)'},
  {id:'mid',name:'中',note:'你的：强调色 24% · 我的：强调色 6% · 底 90%。我心里的推荐：两边都托得住字，你的一眼能认出来。',
   uf:`color-mix(in srgb,var(--accent) 24%,${T}.9))`,af:`color-mix(in srgb,var(--accent) 6%,${T}.9))`,r:'18px',
   edge:'inset 0 1px 0 rgb(var(--hi)/.6)',sh:'0 2px 12px color-mix(in srgb,var(--ink) 7%,transparent)'},
  {id:'solid',name:'实',note:'你的：强调色 34% · 我的：强调色 5% · 底 95%。最清楚，几乎不透图，更像纸片。',
   uf:`color-mix(in srgb,var(--accent) 34%,${T}.95))`,af:`color-mix(in srgb,var(--accent) 5%,${T}.95))`,r:'18px',
   edge:'inset 0 1px 0 rgb(var(--hi)/.65)',sh:'0 3px 14px color-mix(in srgb,var(--ink) 8%,transparent)'},
  {id:'ink',name:'你那边实色',note:'你的：强调色实心 + 白字 · 我的：同「中」。像 iMessage，谁说的最分明，但你的气泡会很抢眼。',
   uf:`color-mix(in srgb,var(--accent) 88%,${T}1))`,ut:'#fff',af:`color-mix(in srgb,var(--accent) 6%,${T}.9))`,r:'18px',
   edge:'inset 0 1px 0 rgb(var(--hi)/.5)',sh:'0 2px 12px color-mix(in srgb,var(--ink) 7%,transparent)'},
]
const state={theme:'apricot',bg:'gradient',fav:new Set()}

const ico={
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  retry:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg>',
  multi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/><circle cx="12" cy="15" r="1.1" fill="currentColor" stroke="none"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
}
const act=(t,u)=>`<div class="act">${ico.copy}${u?'':ico.retry}${ico.multi}<span class="t">${t}</span></div>`

function chat(v){
  const listNow=`<div class="b">2. 操作行</div>
    <div class="b bare"><ul><li><b>时间</b>：两边的消息下面都带。</li><li><b>双勾</b>：保存成功时不显示，出问题才出现。</li><li><b>收藏</b>：记进待办了，这次不做。</li></ul></div>`
  const listNew=`<div class="b wide"><h4>2. 操作行</h4><ul><li><b>时间</b>：两边的消息下面都带。</li><li><b>双勾</b>：保存成功时不显示，出问题才出现。</li><li><b>收藏</b>：记进待办了，这次不做。</li></ul></div>`
  const codeBlock=v.now
    ? `<div class="b bare"><div class="code">--chat-bubble-radius: 18px;</div></div>`
    : `<div class="b wide">改的就是这一行：<div class="code">--chat-bubble-radius: 18px;</div></div>`
  return `
  <div class="stream">
    <div class="wake">言之 · 14:30 醒来</div>
    <div class="row a"><div class="b">两点半了，去把 GPT 的额度刷一下。</div><div class="b">刷完回来接着说。</div>${act('14:30')}</div>
    <div class="row u"><div class="b">刷新好了，我回来啦。</div>${act('14:37',1)}</div>
    <div class="tp">Thought process <i>· 12.3s ›</i></div>
    <div class="row a"><div class="b">好，接着气泡。</div>${v.now?listNow:listNew}${codeBlock}<div class="b">你看哪一张顺眼。</div>${act('14:38')}</div>
    <div class="row u"><div class="b">可以的，还有一个问题，现在你的消息这种带 bullet point 的，不在气泡内。</div>${act('14:53',1)}</div>
    <div class="row a"><div class="b">所以这一版，全都进气泡了。</div>${act('14:54')}</div>
  </div>`
}

function render(){
  document.body.dataset.theme=state.theme
  document.body.dataset.bg=state.bg
  document.getElementById('ctrl').innerHTML=
    THEMES.map(([k,n])=>`<button class="chip ${state.theme===k?'on':''}" data-t="${k}">${n}</button>`).join('')+
    '<span class="sep"></span>'+
    BGS.map(([k,n])=>`<button class="chip ${state.bg===k?'on':''}" data-b="${k}">${n}</button>`).join('')
  document.getElementById('rail').innerHTML=VARIANTS.map(v=>`
    <div class="slot">
      <div class="phone ${v.now?'v-now':''}" style="--uf:${v.uf};--af:${v.af};--r:${v.r};--edge:${v.edge};--sh:${v.sh};${v.ut?`--ut:${v.ut}`:''}">
        ${state.bg==='photo'?'<div class="bgl photo"></div><div class="photo-veil"></div>':''}
        <div class="top">
          <span class="back">‹</span><span class="av">言</span>
          <div class="nm"><div class="l1">言之 <span class="cap">CHAT</span></div><div class="l2">Pro · Opus 5.5 · High</div></div>
          <span class="ic">${ico.cal}</span><span class="ic">${ico.more}</span>
        </div>
        ${chat(v)}
        <div class="composer"><span>写点什么……</span><span class="send">${ico.send}</span></div>
      </div>
      <div class="meta"><div><b>${v.name}</b><small>${v.note}</small></div>
        <button class="heart ${state.fav.has(v.id)?'on':''}" data-f="${v.id}">${state.fav.has(v.id)?'♥':'♡'}</button></div>
    </div>`).join('')
  const favs=VARIANTS.filter(v=>state.fav.has(v.id)).map(v=>v.name)
  document.getElementById('foot').innerHTML=favs.length
    ?`收藏了：<b>${favs.join('、')}</b>。截图或者直接告诉我名字就行。`
    :'点心收藏，收藏的会列在这里。'
}
document.addEventListener('click',e=>{
  const el=e.target.closest('button'); if(!el) return
  if(el.dataset.t) state.theme=el.dataset.t
  else if(el.dataset.b) state.bg=el.dataset.b
  else if(el.dataset.f){state.fav.has(el.dataset.f)?state.fav.delete(el.dataset.f):state.fav.add(el.dataset.f)}
  else return
  const x=document.getElementById('rail').scrollLeft
  render()
  document.getElementById('rail').scrollLeft=x
})
render()
</script>
</body>
</html>
